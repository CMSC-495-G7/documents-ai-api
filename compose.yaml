name: documents-ai-api

services:
  api:
    build: .
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-before-deploying-documents-ai}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      POSTGRES_DB: ${POSTGRES_DB:-documents_ai}
      POSTGRES_USER: ${POSTGRES_USER:-documents_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documents_ai}
      # Container-to-container traffic always uses the service name and internal port.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@acme.example}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-local-only}
      SEED_EMPLOYEE_EMAIL: ${SEED_EMPLOYEE_EMAIL:-employee@acme.example}
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-employee-local-only}
      DOCUMENT_MAX_UPLOAD_MB: ${DOCUMENT_MAX_UPLOAD_MB:-16}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ASK_EMBEDDING_MODEL: ${ASK_EMBEDDING_MODEL:-gemini-embedding-2}
      ASK_EMBEDDING_DIMENSIONS: ${ASK_EMBEDDING_DIMENSIONS:-3072}
      ASK_EMBEDDING_API_KEY: ${ASK_EMBEDDING_API_KEY:-}
      ASK_EMBEDDING_BASE_URL: ${ASK_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ASK_EMBEDDING_TIMEOUT_SECONDS: ${ASK_EMBEDDING_TIMEOUT_SECONDS:-10}
      ASK_LLM_MODEL: ${ASK_LLM_MODEL:-gemini-3.1-flash-lite}
      ASK_LLM_API_KEY: ${ASK_LLM_API_KEY:-}
      ASK_LLM_BASE_URL: ${ASK_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ASK_LLM_TIMEOUT_SECONDS: ${ASK_LLM_TIMEOUT_SECONDS:-30}
      ASK_MAX_ANSWER_TOKENS: ${ASK_MAX_ANSWER_TOKENS:-1024}
      ASK_MAX_CONTEXT_CHUNKS: ${ASK_MAX_CONTEXT_CHUNKS:-6}
      ASK_SIMILARITY_CUTOFF: ${ASK_SIMILARITY_CUTOFF:-0.35}
    ports:
      - "127.0.0.1:${DOCUMENTS_AI_API_PORT:-8000}:8000"
    volumes:
      - ./manage.py:/app/manage.py
      - ./config:/app/config
      - ./core:/app/core
      - ./users:/app/users
      - ./documents:/app/documents
      - ./ask:/app/ask
      # Uploaded files, kept across restarts.
      - uploads:/app/uploads
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5).close()"
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 5

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents_ai}
      POSTGRES_USER: ${POSTGRES_USER:-documents_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documents_ai}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP stays unavailable while the image's temporary initialization server runs.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  uploads:
